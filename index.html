<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B2418">
<title>Roméo & Kevine – Invitation de mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Cinzel:wght@400;500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">

<!-- ============ TEXTES À MODIFIER ============ -->
<script>
const CONFIG = {
  prenoms: ["Roméo", "Kevine"],
  initiales: "R&K",
  dateISO: "2028-02-01T10:00:00",
  dateTexte: "1er février 2028",
  invitation: "Nous avons la joie de vous inviter à célébrer notre mariage.",
  lieu: { nom: "La salle de L’opulence", adresse: "Maetur", ville: "Bafoussam", pays: "Cameroun",
    coords: "5.5026199,10.4469869",
    itineraire: "https://www.google.com/maps/dir//Quartier+MAETUR,+GC3W%2B2QX,+Bafoussam/@4.0501248,9.74848,12z/data=!4m8!4m7!1m0!1m5!1m1!1s0x105f9b430f300f3d:0x77ade0fb3c2c6f73!2m2!1d10.4469869!2d5.5026199?entry=ttu" },
  histoire: [
    { date: "Notre rencontre", titre: "Un simple bonjour", texte: "Lors d’une visite chez mon petit frère, venu saluer son fils, nos chemins se sont croisés." },
    { date: "13 septembre", titre: "Le premier rendez-vous", texte: "Ce soir-là a marqué le début de notre histoire, qui continue jusqu’à aujourd’hui." },
    { date: "1er février 2027", titre: "La demande en mariage", texte: "À Bafoussam, la question a été posée, et la réponse était oui." }
  ],
  programme: [
    { h: "10h00", titre: "Accueil des invités", texte: "Installation et rafraîchissements." },
    { h: "11h00", titre: "Cérémonie", texte: "L’échange des vœux et des alliances." },
    { h: "13h00", titre: "Séance photos", texte: "Photos de famille et avec les amis." },
    { h: "14h30", titre: "Repas", texte: "Déjeuner, musique et danse." },
    { h: "18h00", titre: "Remerciements", texte: "Un dernier mot pour vous dire merci." }
  ],
  tenue: {
    texte: "Nous vous invitons à porter l’une de ces teintes, en tenue élégante.",
    couleurs: [ { nom: "Crème", hex: "#F6EEDF" }, { nom: "Terracotta", hex: "#C2603E" }, { nom: "Brun profond", hex: "#3B2418" } ]
  },
  rsvp: {
    texte: "Merci de nous confirmer votre présence avant le",
    limite: "1er décembre 2027",
    lien: "https://docs.google.com/forms/d/e/1FAIpQLSerkkKEHGSvdcRaletfAqLLpbc4KqgaYqpu1_OpzqTi3REgvw/viewform"
  },
  hashtag: "#RoméoEtKévine",
  merci: "Merci de faire partie de notre histoire"
};
// Photos : remplacez les fichiers du dossier « photos » en gardant les mêmes noms
const PHOTOS = { accueil: "photos/accueil.jpg", galerie: [ {src:"photos/galerie-1.jpg",wide:1}, {src:"photos/galerie-2.jpg"}, {src:"photos/galerie-3.jpg",wide:1}, {src:"photos/galerie-4.jpg"} ] };
</script>
<!-- ============ FIN DES TEXTES ============ -->

<style>
:root{--c:#F6EEDF;--t:#C2603E;--td:#9E4A2E;--b:#3B2418}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Jost,sans-serif;font-weight:300;font-size:17px;line-height:1.7;background:var(--c);color:var(--b);-webkit-text-size-adjust:100%;overflow-x:hidden}
body.lock{overflow:hidden}
#app{opacity:0}
body.ready #app{opacity:1;transition:opacity 2.2s ease}
section{padding:clamp(72px,14vw,130px) 24px;text-align:center}
section>*{max-width:640px;margin-inline:auto}
.sur{font-family:Cinzel,serif;letter-spacing:.28em;font-size:.72rem;color:var(--t);text-transform:uppercase}
h2.titre{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(2rem,8vw,3rem);line-height:1.2;margin:.3em auto 1.1em}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.12em}
.w span{display:inline-block;transform:translateY(115%);transition:transform 1.3s cubic-bezier(.2,.7,.2,1) var(--d)}
.titre.in .w span{transform:none}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.4s ease,transform 1.4s ease}
.rv.in{opacity:1;transform:none}
.btn{display:inline-block;padding:15px 32px;background:var(--t);color:var(--c);font-family:Cinzel,serif;letter-spacing:.16em;font-size:.78rem;text-decoration:none;text-transform:uppercase;border:0;border-radius:2px;cursor:pointer;transition:background .8s ease}
.btn:hover,.btn:focus-visible{background:var(--td)}
.btn:focus-visible{outline:2px solid var(--b);outline-offset:3px}

/* Ouverture */
#intro{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#FBF5E9,#EADDC6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:64px;transition:opacity 1.8s ease,visibility 1.8s}
#intro.done{opacity:0;visibility:hidden}
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/2;perspective:900px}
.env-back{position:absolute;inset:0;background:#A84F31;border-radius:3px}
.card{position:absolute;left:6%;right:6%;top:6%;bottom:6%;background:var(--c);z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(59,36,24,.25);transition:transform 1.6s cubic-bezier(.3,.7,.2,1) 1s}
.card b{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(1.7rem,8vw,2.3rem);line-height:1.1;color:var(--t)}
.card small{font-family:Cinzel,serif;font-size:.6rem;letter-spacing:.25em;text-transform:uppercase}
.env-front{position:absolute;inset:0;z-index:3;background:var(--t);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:55%;background:#D0714E;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform 1.1s ease,z-index 0s .55s}
.seal{position:absolute;left:50%;top:55%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#B8402C,#7E2318);color:#F3D9C8;font-family:Cinzel,serif;font-size:.8rem;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:opacity .5s ease}
#intro.open .seal{opacity:0}
#intro.open .flap{transform:rotateX(180deg);z-index:1}
#intro.open .card{transform:translateY(-62%)}
#intro.open #openBtn{opacity:0;pointer-events:none}
#openBtn{transition:opacity .6s ease,background .8s ease}

/* Accueil */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--c);background:linear-gradient(rgba(59,36,24,.5),rgba(59,36,24,.75)),url(photos/accueil.jpg) 50% 30%/cover var(--b)}
.noms{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(3.6rem,19vw,7rem);line-height:1.05}
.noms em{display:block;font-size:.55em;font-style:normal;opacity:.85}
.hero p.d{font-family:Cinzel,serif;letter-spacing:.22em;font-size:.85rem;margin-top:18px;text-transform:uppercase}
.hero p.i{margin-top:14px;max-width:420px}
.cd{display:flex;gap:10px;justify-content:center;margin-top:34px}
.cd div{min-width:68px;padding:12px 6px;border:1px solid rgba(246,238,223,.5);border-radius:2px;background:rgba(59,36,24,.25)}
.cd b{display:block;font-family:'Bodoni Moda',serif;font-weight:400;font-size:1.7rem;line-height:1.2}
.cd small{font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase}

/* Histoire */
.tl{position:relative;text-align:left;padding-left:36px}
.tl::before,.tl .fill{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(59,36,24,.2)}
.tl .fill{background:var(--t);transform-origin:top;transform:scaleY(0)}
.ev{position:relative;margin-bottom:46px}
.ev:last-child{margin-bottom:0}
.ev::before{content:"";position:absolute;left:-36px;top:.45em;width:15px;height:15px;border-radius:50%;background:var(--c);border:2px solid var(--t)}
.ev .dt{font-family:Cinzel,serif;color:var(--t);font-size:.8rem;letter-spacing:.18em}
.ev h3{font-family:'Bodoni Moda',serif;font-weight:400;font-size:1.45rem;margin:2px 0 4px}

/* Galerie */
.gal{display:grid;gap:40px;max-width:520px;overflow:visible}
.ph{overflow:hidden;aspect-ratio:4/5;background:var(--t);box-shadow:0 24px 40px -22px rgba(59,36,24,.6);will-change:transform;width:88%}
.ph.wide{aspect-ratio:4/3}
.ph:nth-child(even){width:78%;margin-left:auto}
.ph img{width:100%;height:124%;object-fit:cover;display:block;will-change:transform}

/* Programme */
.pg{text-align:left}
.pg div{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid rgba(59,36,24,.18)}
.pg b{font-family:'Bodoni Moda',serif;font-weight:400;font-size:1.35rem;color:var(--t)}
.pg h3{font-family:Cinzel,serif;font-weight:400;font-size:.95rem;letter-spacing:.1em}

/* Lieu, tenue, rsvp */
.lieu{background:#EFE2CC}
.lieu iframe{width:100%;max-width:640px;height:280px;border:0;border-radius:2px;margin:26px auto 28px;display:block}
.sw{display:flex;justify-content:center;gap:26px;margin-top:30px}
.sw i{display:block;width:62px;height:62px;border-radius:50%;border:1px solid rgba(59,36,24,.3);margin:0 auto 8px}
.sw span{font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase}
.rsvp{background:var(--t);color:var(--c)}
.rsvp .sur{color:var(--c)}
.rsvp .btn{background:var(--c);color:var(--b);margin-top:26px}
.rsvp .btn:hover{background:#fff}
footer{background:var(--b);color:var(--c);text-align:center;padding:70px 24px calc(56px + env(safe-area-inset-bottom,0px))}
footer .ini{font-family:'Pinyon Script',cursive;font-size:3rem;line-height:1.2;margin-top:12px}
footer .tag{font-family:Cinzel,serif;letter-spacing:.2em;font-size:.85rem;color:#E0A58B}

@media (prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *{transition:none!important;animation:none!important}
 .rv,.w span{opacity:1!important;transform:none!important}
}
</style>
</head>
<body class="lock">

<div id="intro">
  <div class="env">
    <div class="env-back"></div>
    <div class="card"><small>Vous êtes invités</small><b id="cardNames"></b></div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <div class="seal" id="seal"></div>
  </div>
  <button class="btn" id="openBtn" type="button">Ouvrir notre invitation</button>
</div>

<main id="app"></main>

<script>
(function(){
  const C = CONFIG, $ = s => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const L = C.lieu, adr = encodeURIComponent(`${L.nom}, ${L.adresse}, ${L.ville}, ${L.pays}`);
  const [p1, p2] = C.prenoms;

  $("#cardNames").innerHTML = `${p1}<br>&amp; ${p2}`;
  $("#seal").textContent = C.initiales;

  const T = t => `<h2 class="titre">${t}</h2>`;
  $("#app").innerHTML = `
  <section class="hero" id="accueil">
    <h1 class="noms">${p1}<em>&amp;</em>${p2}</h1>
    <p class="d">${C.dateTexte}</p>
    <p class="i">${C.invitation}</p>
    <div class="cd" id="cd" aria-label="Compte à rebours"></div>
  </section>

  <section id="histoire">
    <p class="sur rv">Notre histoire</p>${T("Comment tout a commencé")}
    <div class="tl" id="tl"><span class="fill" id="fill"></span>
      ${C.histoire.map(e => `<div class="ev rv"><p class="dt">${e.date}</p><h3>${e.titre}</h3><p>${e.texte}</p></div>`).join("")}
    </div>
  </section>

  <section id="galerie" style="background:#EFE2CC">
    <p class="sur rv">Galerie</p>${T("Quelques souvenirs")}
    <div class="gal">${PHOTOS.galerie.map((g,i) => `<figure class="ph${g.wide?" wide":""}"><img src="${g.src}" alt="Photo ${i+1} de ${p1} et ${p2}" loading="lazy"></figure>`).join("")}</div>
  </section>

  <section id="programme">
    <p class="sur rv">Le jour J</p>${T("Le programme")}
    <div class="pg">${C.programme.map(e => `<div class="rv"><b>${e.h}</b><span><h3>${e.titre}</h3>${e.texte}</span></div>`).join("")}</div>
  </section>

  <section class="lieu" id="lieu">
    <p class="sur rv">Le lieu</p>${T(L.nom)}
    <p class="rv">${L.adresse}, ${L.ville}</p>
    <iframe class="rv" title="Carte Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${L.coords}&z=16&output=embed"></iframe>
    <a class="btn rv" target="_blank" rel="noopener" href="${L.itineraire}">Ouvrir l’itinéraire</a>
  </section>

  <section id="tenue">
    <p class="sur rv">Tenue</p>${T("Dress code")}
    <p class="rv">${C.tenue.texte}</p>
    <div class="sw rv">${C.tenue.couleurs.map(c => `<div><i style="background:${c.hex}"></i><span>${c.nom}</span></div>`).join("")}</div>
  </section>

  <section class="rsvp" id="rsvp">
    <p class="sur rv">Réponse</p>${T("Confirmer ma présence")}
    <p class="rv">${C.rsvp.texte} <strong>${C.rsvp.limite}</strong>.</p>
    <a class="btn rv" target="_blank" rel="noopener" href="${C.rsvp.lien}">Je confirme ma présence</a>
  </section>

  <footer>
    <p class="rv">${C.merci}</p>
    <p class="ini rv">${C.initiales}</p>
    <p class="tag rv">${C.hashtag}</p>
  </footer>`;

  /* Titres mot par mot */
  document.querySelectorAll(".titre").forEach(h => {
    h.setAttribute("aria-label", h.textContent);
    h.innerHTML = h.textContent.split(" ").map((w,i) => `<span class="w" aria-hidden="true"><span style="--d:${i*.14}s">${w}</span></span>`).join(" ");
  });

  /* Compte à rebours */
  const cd = $("#cd"), target = new Date(C.dateISO).getTime();
  function tick(){
    let d = target - Date.now();
    if (d <= 0) { cd.innerHTML = "<p>C’est aujourd’hui !</p>"; return; }
    const v = [["jours",864e5],["heures",36e5],["minutes",6e4],["secondes",1e3]].map(([n,m]) => { const x = Math.floor(d/m); d -= x*m; return `<div><b>${String(x).padStart(2,"0")}</b><small>${n}</small></div>`; });
    cd.innerHTML = v.join("");
  }
  tick(); setInterval(tick, 1000);

  /* Apparitions au défilement */
  function startReveal(){
    const els = document.querySelectorAll(".rv,.titre");
    if (reduce || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15, rootMargin: "0px 0px -6% 0px" });
    els.forEach(e => io.observe(e));
  }

  /* Frise + profondeur de la galerie */
  const tl = $("#tl"), fill = $("#fill"), figs = [...document.querySelectorAll(".ph")];
  let raf = 0;
  function onScroll(){
    if (reduce) { fill.style.transform = "scaleY(1)"; return; }
    const vh = innerHeight, r = tl.getBoundingClientRect();
    fill.style.transform = `scaleY(${Math.min(1, Math.max(0, (vh*.7 - r.top) / r.height))})`;
    figs.forEach(f => {
      const b = f.getBoundingClientRect();
      const p = Math.max(-1, Math.min(1, (b.top + b.height/2 - vh/2) / vh));
      f.firstElementChild.style.transform = `translateY(${(-p*9 - 9).toFixed(2)}%)`;
      f.style.transform = `scale(${(1 - Math.abs(p)*.07).toFixed(3)})`;
    });
    raf = 0;
  }
  addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(onScroll); }, { passive: true });
  addEventListener("resize", onScroll);
  onScroll();

  /* Ouverture de l'enveloppe */
  $("#openBtn").addEventListener("click", () => {
    const intro = $("#intro");
    intro.classList.add("open");
    setTimeout(() => {
      intro.classList.add("done");
      document.body.classList.remove("lock");
      document.body.classList.add("ready");
      scrollTo(0,0);
      startReveal();
    }, reduce ? 300 : 3800);
  });
})();
</script>
</body>
</html>
